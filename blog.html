<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Rahul Satish</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/components.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Rahul Satish</a>
      <div class="nav-links">
        <a href="bio.html">Bio</a>
        <a href="research.html">Research</a>
        <a href="news.html">News</a>
        <a href="blog.html">Blog</a>
        <a href="links.html">Links</a>
        <a href="albums/" target="_blank">Albums</a>
        <a href="assets/data/cv.pdf" target="_blank">CV</a>
      </div>
      <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
    </nav>
  </header>

  <main>
    <h1>Latest Articles</h1>
    <p style="font-size: 1.1rem; color: var(--color-text-secondary); margin-bottom: var(--spacing-xl); text-align: center;">
      Two spaces for different kinds of writing.
    </p>

    <p style="text-align: center; margin-bottom: var(--spacing-xl);">
      <a href="https://rahulsatish98.substack.com/publish" target="_blank" rel="noopener noreferrer">Write or publish on the original Substack →</a>
    </p>

    <div id="blog-container">
      <!-- Blog posts will be loaded here -->
    </div>
    
    <div id="loading" class="empty-state" style="display: none;">
      <p>Loading articles...</p>
    </div>

    <div id="error" class="empty-state" style="display: none;">
      <p>Unable to load articles. Please try again later.</p>
    </div>
  </main>

  <script>
    /**
    * Substack Blog Manager - Loads the build-time RSS snapshot and displays posts
     */
    class SubstackBlogManager {
      constructor(substackUsername) {
        this.substackUsername = substackUsername;
        this.feedUrl = 'assets/data/blog.json';
        this.sections = {};
      }

      async loadBlogPosts() {
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const container = document.getElementById('blog-container');

        try {
          loadingDiv.style.display = 'block';

          const response = await fetch(this.feedUrl);
          
          if (!response.ok) {
            throw new Error('Failed to fetch from Substack');
          }

          const data = await response.json();
          this.sections = data.sections || {};
          
          loadingDiv.style.display = 'none';
          this.render();
        } catch (error) {
          console.error('Error loading blog posts:', error);
          
          // Fallback: Show a message with manual Substack link
          loadingDiv.style.display = 'none';
          container.style.display = 'none';
          errorDiv.style.display = 'block';
          
          // Add a link to Substack
          const substackLink = `<p style="margin-top: var(--spacing-lg);"><a href="https://${this.substackUsername}.substack.com" target="_blank" style="font-size: 1.1rem; font-weight: 600;">Read on Substack →</a></p>`;
          errorDiv.insertAdjacentHTML('afterend', substackLink);
        }
      }

      render() {
        const container = document.getElementById('blog-container');
        container.innerHTML = Object.values(this.sections).map(section => `
          <section class="blog-section">
            <div class="blog-section-heading">
              <div>
                <p class="blog-section-kicker">Substack</p>
                <h2>${this.escapeHtml(section.title)}</h2>
                <p>${this.escapeHtml(section.description)}</p>
              </div>
              <a href="${this.escapeHtml(section.publicationUrl)}" target="_blank" rel="noopener noreferrer">Open publication →</a>
            </div>
            <div class="blog-grid">
              ${section.posts.length ? section.posts.map(post => this.renderPost(post)).join('') : '<div class="empty-state"><p>No published posts here yet.</p></div>'}
            </div>
          </section>
        `).join('');
      }

      renderPost(post) {
        return `
          <article class="blog-card">
            ${post.image ? `<div class="blog-image" style="background-image: url('${this.escapeHtml(post.image)}')"></div>` : '<div class="blog-image" style="background: linear-gradient(135deg, var(--color-accent), var(--color-accent-tertiary));"></div>'}
            <div class="blog-content">
              <span class="blog-category">${this.escapeHtml(post.category)}</span>
              <h3>${this.escapeHtml(post.title)}</h3>
              <p class="blog-date">${post.date ? new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : ''}</p>
              <p class="blog-description">${this.escapeHtml(post.description)}</p>
              <a href="${this.escapeHtml(post.url)}" target="_blank" rel="noopener noreferrer" class="read-more">Read on Substack →</a>
            </div>
          </article>
        `;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }

    // Initialize blog manager with your Substack username
    // Replace 'your-substack-username' with your actual Substack subdomain
    document.addEventListener('DOMContentLoaded', () => {
      const blogManager = new SubstackBlogManager('longconversations');
      blogManager.loadBlogPosts();
    });
  </script>

</body>
</html>
